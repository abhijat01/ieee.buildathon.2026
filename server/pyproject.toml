[project]
name = "ieee-server"
version = "0.2.0"
description = "IEEE Workspace server: FastAPI, SQLAlchemy, and Microsoft Agent Framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-ag-ui>=1.5.1",
    "agent-framework-core>=1.21.0",
    "agent-framework-openai>=1.16.0",
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.121,<0.142",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.1.3",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ieee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
